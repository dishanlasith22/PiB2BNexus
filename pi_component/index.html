<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:13px Arial,sans-serif;margin:0;padding:4px;color:#333}.ok{color:#16803c}.fail{color:#b42318}</style></head>
<body><span id="status">Waiting for secure Pi sign-in...</span>
<script>
(function(){
 const status=document.getElementById("status");
 let args={},sent=false;
 function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},"*");}
 function setValue(value){send("streamlit:setComponentValue",{value,dataType:"json"});}
 send("streamlit:componentReady",{apiVersion:1});
 send("streamlit:setFrameHeight",{height:28});
 async function receive(){
   if(sent)return;
   let token="";
   try{
     const match=window.parent.location.hash.match(/(?:^#|&)pi_session=([^&]+)/);
     if(!match)return;
     token=decodeURIComponent(match[1]);
     if(!token)return;
     sent=true;
     window.parent.history.replaceState(null,"",window.parent.location.pathname+window.parent.location.search);
     status.textContent="Verifying Pi session...";
     const response=await fetch((args.backend_url||"").replace(/\/$/,"")+"/auth/session",{
       headers:{"Authorization":"Bearer "+token}
     });
     const result=await response.json().catch(()=>({}));
     if(!response.ok||!result.user||!result.user.uid||!result.user.username)
       throw new Error(result.detail||"Session verification failed.");
     setValue({verified:true,app_session_token:token,uid:result.user.uid,username:result.user.username});
     status.innerHTML='<span class="ok">Pi account verified.</span>';
   }catch(error){
     sent=false;
     status.innerHTML='<span class="fail">Pi session error: '+String(error.message||error)+'</span>';
   }
 }
 window.addEventListener("message",event=>{
   if(event.data&&event.data.type==="streamlit:render"){
     args=event.data.args||{};
     receive();
   }
 });
 // Streamlit may deliver the first render immediately after componentReady.
 setTimeout(receive,100);
})();
</script></body></html>
